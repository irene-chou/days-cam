<title>DaysCam 字型選單 D-6</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: option switcher on top; real-app phone mockup left, option notes right; stacks at phone width */
:root{
  --ground:#F3EFEA; --ink:#221F1C; --muted:#6B645D; --line:#DDD5CC; --card:#FBF8F5; --accent:#C9772A; --tag:#F8E6D2;
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#141312;--ink:#EDE8E3;--muted:#A39B93;--line:#2E2B28;--card:#1C1A18;--accent:#FFC27A;--tag:#3A2A18;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#141312;--ink:#EDE8E3;--muted:#A39B93;--line:#2E2B28;--card:#1C1A18;--accent:#FFC27A;--tag:#3A2A18;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:28px 48px}
header{max-width:1060px;margin:0 auto 18px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
h1{font-size:24px;margin:2px 0 6px;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:66ch}
.switch{max-width:1060px;margin:0 auto 22px;display:flex;flex-wrap:wrap;gap:8px}
.switch button{font:inherit;font-size:14px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
.switch button[aria-pressed="true"]{color:var(--card);background:var(--ink);border-color:var(--ink)}
.switch button .rec{font-size:11px;color:var(--accent);margin-left:4px}
.switch button[aria-pressed="true"] .rec{color:var(--tag)}
.wrap{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr);justify-items:center}}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.demo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:345px}
.demo label,.demo button{display:flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.legend{font-size:12.5px;color:var(--muted);text-align:center;max-width:345px}

/* ===== phone: real screenshot base, app palette fixed (app is light-only) ===== */
.phone{--bg:#F7F3EE;--fill:rgba(42,38,34,.07);--fill-strong:rgba(42,38,34,.12);--t1:#2A2622;--t2:rgba(42,38,34,.62);--t3:rgba(42,38,34,.38);--hair:rgba(42,38,34,.10);--active:#C9772A;--danger:#E0503F;
  width:345px;max-width:100%;aspect-ratio:689/1500;position:relative;color:var(--t1);font-family:ui-rounded,"SF Pro Rounded","PingFang TC",sans-serif;user-select:none;-webkit-user-select:none;background-size:100% 100%;border-radius:48px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.18)}
.overlay{position:absolute}
.content{position:absolute;left:0;right:0;top:76.1%;height:14.1%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:0 14px}
.content::-webkit-scrollbar{display:none}
.sym{display:inline-block;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex:none}
.nm{display:block;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex:none}
.cell{border:0;background:transparent;color:var(--t1);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0;position:relative;font:inherit}
.cell.sel{box-shadow:inset 0 0 0 1.3px var(--active)}
.cell:focus-visible,.row:focus-visible,.filt:focus-visible{outline:2px solid var(--active);outline-offset:-2px}
.st{height:12px;display:flex;align-items:center;gap:3px;font-size:9px;font-weight:700;color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap}
.st .sym{width:10px;height:10px}
.fail .st{color:var(--danger)}
.ring{width:10px;height:10px;border-radius:50%;background:conic-gradient(var(--active) calc(var(--p)*1%),var(--fill-strong) 0);-webkit-mask:radial-gradient(circle,transparent 2.6px,#000 3px);mask:radial-gradient(circle,transparent 2.6px,#000 3px)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 7px;padding:3px 0 6px}
.gl{grid-column:1/-1;font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.06em;padding:4px 2px 0}
.gridA .cell{height:41px}
.gridC .cell{height:38px}
.more{color:var(--t2);flex-direction:row;gap:5px;font-size:12px;font-weight:700}
.more .sym{width:14px;height:14px}
.filters{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;background:var(--bg);padding:3px 0 2px;z-index:1}
.filters::-webkit-scrollbar{display:none}
.filt{flex:none;border:0;background:transparent;font:inherit;font-size:11.5px;font-weight:700;color:var(--t3);padding:3px 8px;border-radius:7px;cursor:pointer}
.filt[aria-pressed="true"]{color:var(--active)}
.hrow{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;align-items:flex-end;height:100%;padding-bottom:10px}
.hrow::-webkit-scrollbar{display:none}
.hg{display:flex;flex-direction:column;flex:none}
.hg+.hg{margin-left:6px}
.hg .gl{padding:0 6px;height:15px}
.hg .items{display:flex;gap:2px}
.hrow .cell{padding:4px 8px;height:44px}
/* sheet (option C) */
.sheet{position:absolute;inset:0;background:#fff;z-index:6;display:flex;flex-direction:column;border-radius:48px;overflow:hidden;animation:up .3s cubic-bezier(.34,1.2,.5,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.shead{display:flex;justify-content:space-between;align-items:center;padding:74px 22px 6px}
.shead b{font-size:17px}
.shead button{border:0;background:transparent;color:var(--active);cursor:pointer;padding:4px}
.shead .sym{width:20px;height:20px}
.slist{flex:1;overflow-y:auto;padding:0 10px 30px;scrollbar-width:none}
.slist::-webkit-scrollbar{display:none}
.sec{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.06em;padding:12px 12px 2px}
.row{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;font:inherit;padding:0 10px;height:44px;cursor:pointer;color:var(--t1);border-radius:10px;text-align:left}
.row .ck{width:16px;color:var(--active)}
.row .ck .sym{width:14px;height:13px}
.row .rt{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.row .rt .sym{width:18px;height:18px;color:var(--active)}
.row .rt .ring{width:16px;height:16px;-webkit-mask:radial-gradient(circle,transparent 5px,#000 5.6px);mask:radial-gradient(circle,transparent 5px,#000 5.6px)}
.row.fail .rt{color:var(--danger)}
.row.fail .rt .sym{color:var(--danger)}
.row .dots{border:0;background:transparent;padding:6px 2px;cursor:pointer;color:var(--t2);display:flex}
.row .dots .sym{width:16px;height:6px;color:var(--t2)}
/* menu + toast */
.layer{position:absolute;inset:0;z-index:8;display:none}
.layer.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(42,38,34,.18)}
.menu{position:absolute;left:50%;transform:translateX(-50%);width:230px;background:rgba(255,255,255,.97);border-radius:14px;box-shadow:0 12px 36px rgba(60,40,20,.25);overflow:hidden}
.menu .ttl{padding:10px 14px 8px;font-size:11.5px;color:var(--t2);border-bottom:1px solid var(--hair);line-height:1.45}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border:0;font:inherit;font-size:14.5px;font-weight:600;padding:11px 14px;cursor:pointer;color:var(--danger)}
.menu button .sym{width:15px;height:17px}
.menu button.plain{color:var(--t1);border-top:1px solid var(--hair)}
.toast{position:absolute;left:50%;top:80px;transform:translateX(-50%);background:rgba(42,38,34,.86);color:#fff;font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .25s;z-index:9;pointer-events:none}
.toast.on{opacity:1}
/* notes */
.notes{display:flex;flex-direction:column;gap:14px;min-width:0;max-width:62ch}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.item h3{margin:0 0 4px;font-size:15.5px;text-wrap:balance}
.item p,.item li{margin:0;font-size:14px;color:var(--muted)}
.item ul{margin:4px 0 0;padding-left:1.2em}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;background:var(--tag);color:var(--accent);border-radius:6px;padding:1px 8px;margin-bottom:6px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.pc{grid-template-columns:1fr}}
.pc h4{margin:0 0 2px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="eyebrow">DAYSCAM 0.3 · 設計稿 D-6 · #162</div>
  <h1>字型選單排版：四種方案</h1>
  <p>底圖是目前 App 疊字面板「樣式 › 字型」的實際畫面（Xcode Preview 截圖），只替換字型區塊。字型區塊高度照現在的面板固定，約兩排格子；21 套字型都要放進這塊。字型名稱都是用真的字型畫的。</p>
</header>

<div class="switch" id="switch" role="group" aria-label="方案"></div>

<div class="wrap">
  <div class="stage">
    <div class="phone" id="phone">
      <img class="overlay" id="overlay" alt="觀景窗疊字">
      <div class="content" id="content"></div>
      <div id="sheetHost"></div>
      <div class="layer" id="layer"><div class="scrim" id="scrim"></div><div class="menu" id="menu"></div></div>
      <div class="toast" id="toast"></div>
    </div>
    <div class="demo">
      <label><input type="checkbox" id="optFail"> 模擬下載失敗</label>
      <label><input type="checkbox" id="optOffline"> 模擬沒網路</label>
      <button type="button" id="reset">重設</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="notes" id="notes"></div>
</div>

          ['優點','面板保持乾淨，清單有空間',['日常換字型只在面板裡點，跟現在一樣','清單一次看到十多套，大小、進度、刪除都放得下','清單外觀跟「管理設定檔」相同，不用新樣式']],
          ['缺點','第一次要多點一下',['剛升級時面板只有蘋方和「更多字型」兩格','下載字型要進清單，多一步']]]},
 D:{name:'D 橫向一排',legend:'所有字型排成一排左右滑，依風格分組。這是上一版設計稿的作法，套進現在的面板高度。',
   notes:[['做法','一排左右滑，依風格分組',['每組上方小標，名字下方狀態小字','點了就下載，下載完才套用；長按刪除']],
          ['優點','畫面最簡單',['只有一排，不佔高度']],
          ['缺點','跟 0.2 的格子不一致',['0.2 已經從橫排改成格子（#129），這是改回去','一次只看得到 4～5 套，下方空白浪費']]]}
};
const $=id=>document.getElementById(id);
const K=345/689, PT=345/402;
let S, opt='C', filter='全部';
function init(){S={sel:'pingfang',state:{},prog:{},timers:{},sheet:false};FONTS.forEach(f=>S.state[f[1]]=(f[4]==='builtin'||f[1]==='huninn')?'done':'none');}
const sym=(n,cls='')=>`<span class="sym ${cls}" style="--m:url(${A['sym-'+n].u})"></span>`;
const mb=v=>v.toFixed(1)+' MB';
function nameImg(id,pt){const c=A['chip-'+id],f=pt/17*PT/3;return `<span class="nm" style="--m:url(${c.u});width:${(c.w*f).toFixed(1)}px;height:${(c.h*f).toFixed(1)}px"></span>`}
function status(id){const f=FONTS.find(x=>x[1]===id),st=S.state[id];
  if(st==='none')return sym('arrow.down.circle')+mb(f[3]);
  if(st==='loading')return `<span class="ring" style="--p:${S.prog[id]|0}"></span>${S.prog[id]|0}%`;
  if(st==='fail')return sym('exclamationmark.arrow.circlepath')+'重試';return '';}
function aria(f){const st=S.state[f[1]];return f[0]+(st==='none'?`，未下載，${mb(f[3])}`:st==='loading'?'，下載中':st==='fail'?'，下載失敗':'')}
function cell(f){const id=f[1];return `<button class="cell ${S.sel===id?'sel':''} ${S.state[id]==='fail'?'fail':''}" data-id="${id}" aria-pressed="${S.sel===id}" aria-label="${aria(f)}">${nameImg(id,15)}${S.state[id]==='done'?'':`<span class="st">${status(id)}</span>`}</button>`}
function groups(list){const g=[];list.forEach(f=>{let x=g[g.length-1];if(!x||x.k!==f[2]){x={k:f[2],items:[]};g.push(x)}x.items.push(f)});return g}
function render(){
  const ov=A['ov-'+S.sel],o=$('overlay'),w=ov.w/3*PT*0.82;o.src=ov.u;o.style.width=w+'px';o.style.left=(618*K-w)+'px';o.style.top=(996*K-ov.h/3*PT*0.82)+'px';
  $('switch').innerHTML=Object.entries(OPTS).map(([k,v])=>`<button type="button" data-k="${k}" aria-pressed="${k===opt}">${v.name}${v.rec?'<span class="rec">建議</span>':''}</button>`).join('');
  $('switch').querySelectorAll('button').forEach(b=>b.onclick=()=>{opt=b.dataset.k;S.sheet=false;filter='全部';$('content').scrollTop=0;render()});
  $('legend').textContent=OPTS[opt].legend;
  $('notes').innerHTML=OPTS[opt].notes.map(([t,h,l])=>`<div class="item"><span class="tag">${t}</span><h3>${h}</h3><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')+
    (opt==='C'?`<div class="item"><span class="tag">我的建議</span><h3>選 C</h3><p>面板高度只放得下約兩排，四種方案裡只有 C 不用把 21 套字型和下載狀態硬塞進這塊。日常換字型時面板跟現在一樣；下載和刪除是偶爾做的事，放進獨立清單剛好。</p></div>`:'');
  const c=$('content'),sc=c.scrollTop,hs=c.querySelector('.hrow')?.scrollLeft||0;
  if(opt==='A')c.innerHTML=`<div class="grid gridA">${groups(FONTS).map(g=>`<div class="gl">${g.k}</div>`+g.items.map(cell).join('')).join('')}</div>`;
  if(opt==='B'){const fl=['全部','已下載','開源','黑','圓','宋','楷','手寫','書法','可愛'];
    const list=FONTS.filter(f=>filter==='全部'||(filter==='已下載'?S.state[f[1]]==='done':f[2]===filter||(filter==='全部')));
    c.innerHTML=`<div class="filters">${fl.map(x=>`<button class="filt" data-f="${x}" aria-pressed="${x===filter}">${x}</button>`).join('')}</div><div class="grid gridA">${list.map(cell).join('')}</div>`;
    c.querySelectorAll('.filt').forEach(b=>b.onclick=()=>{filter=b.dataset.f;c.scrollTop=0;render()});}
  if(opt==='C'){const list=FONTS.filter(f=>S.state[f[1]]==='done');
    c.innerHTML=`<div class="grid gridC">${list.map(cell).join('')}<button class="cell more" id="more" aria-label="更多字型">${sym('arrow.down.circle')}更多字型</button></div>`;
    $('more').onclick=()=>{S.sheet=true;render()};}
  if(opt==='D')c.innerHTML=`<div class="hrow">${groups(FONTS).map(g=>`<div class="hg"><div class="gl">${g.k}</div><div class="items">${g.items.map(cell).join('')}</div></div>`).join('')}</div>`;
  c.scrollTop=sc; const hr=c.querySelector('.hrow'); if(hr)hr.scrollLeft=hs;
  c.querySelectorAll('.cell[data-id]').forEach(b=>{
    b.onclick=()=>{if(b._lp){b._lp=false;return}tap(b.dataset.id)};
    b.oncontextmenu=e=>{e.preventDefault();openMenu(b.dataset.id)};
    let t;b.onpointerdown=()=>{t=setTimeout(()=>{b._lp=true;openMenu(b.dataset.id)},550)};b.onpointerup=b.onpointerleave=()=>clearTimeout(t);
  });
  renderSheet();
}
function renderSheet(){
  const h=$('sheetHost');
  if(!(opt==='C'&&S.sheet)){h.innerHTML='';return}
  const prev=h.querySelector('.slist')?.scrollTop||0, fresh=!h.querySelector('.sheet');
  h.innerHTML=`<div class="sheet" style="${fresh?'':'animation:none'}" role="dialog" aria-label="更多字型"><div class="shead"><b>字型</b><button id="sdone" aria-label="完成">${sym('checkmark')}</button></div>
   <div class="slist">${groups(FONTS).map(g=>`<div class="sec">${g.k}</div>`+g.items.map(f=>{const id=f[1],st=S.state[id];
     let rt='';
     if(st==='none')rt=`${mb(f[3])}${sym('arrow.down.circle')}`;
     if(st==='loading')rt=`${S.prog[id]|0}%<span class="ring" style="--p:${S.prog[id]|0}"></span>`;
     if(st==='fail')rt=`重試${sym('exclamationmark.arrow.circlepath')}`;
     if(st==='done'&&f[2]==='開源')rt=`<span class="dots" data-del="${id}" role="button" aria-label="${f[0]} 更多動作">${sym('ellipsis')}</span>`;
     return `<button class="row ${st==='fail'?'fail':''}" data-id="${id}" aria-label="${aria(f)}"><span class="ck">${S.sel===id?sym('checkmark'):''}</span>${nameImg(id,17)}<span class="rt">${rt}</span></button>`}).join('')).join('')}</div></div>`;
  h.querySelector('.slist').scrollTop=prev;
  $('sdone').onclick=()=>{S.sheet=false;render()};
  h.querySelectorAll('.row').forEach(b=>b.onclick=e=>{const d=e.target.closest('[data-del]');if(d){openMenu(d.dataset.del);return}tap(b.dataset.id)});
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1900)}
function tap(id){
  const st=S.state[id],f=FONTS.find(x=>x[1]===id);
  if(st==='done'){S.sel=id;render();return}
  if(st==='loading'){clearInterval(S.timers[id]);S.state[id]='none';S.prog[id]=0;render();toast('已取消下載');return}
  if($('optOffline').checked){S.state[id]='fail';render();toast('沒有網路，連上後再點一次');return}
  S.state[id]='loading';S.prog[id]=0;render();
  const step=Math.max(4,40/Math.sqrt(f[3]));
  S.timers[id]=setInterval(()=>{
    S.prog[id]=Math.min(100,(S.prog[id]||0)+step);
    if($('optFail').checked&&S.prog[id]>55){clearInterval(S.timers[id]);S.state[id]='fail';render();toast('「'+f[0]+'」下載失敗，點一下重試');return}
    if(S.prog[id]>=100){clearInterval(S.timers[id]);S.state[id]='done';S.sel=id;render();toast('已套用「'+f[0]+'」');return}
    render();
  },120);
}
function openMenu(id){
  const f=FONTS.find(x=>x[1]===id);
  if(S.state[id]!=='done')return;
  if(f[4]==='builtin'){toast('蘋方是內建字型，不能刪除');return}
  if(f[2]!=='開源'){toast('系統字型由 iOS 管理，無法在 App 內刪除');return}
  const using=S.sel===id?'「預設」正在使用，刪除後改回蘋方。':'沒有設定檔在用這套字型。';
  $('menu').innerHTML=`<div class="ttl"><b style="color:var(--t1)">${f[0]}</b>　${mb(f[3])}<br>${using}</div><button id="del">刪除字型${sym('trash')}</button><button class="plain" id="cancel">取消</button>`;
  $('menu').style.top='42%';$('layer').classList.add('on');
  $('del').onclick=()=>{S.state[id]='none';if(S.sel===id)S.sel='pingfang';closeM();render();toast('已刪除「'+f[0]+'」，釋放 '+mb(f[3]))};
  $('cancel').onclick=closeM;
}
function closeM(){$('layer').classList.remove('on')}
$('scrim').onclick=closeM;
$('phone').style.backgroundImage=`url(${A.base.u})`;
$('reset').onclick=()=>{Object.values(S.timers).forEach(clearInterval);init();render()};
init();render();
</script>

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# A newer push supersedes an in-flight review of an older commit.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # New commits invalidate earlier approvals: dismiss claude[bot] approvals of older commits
      # and clear the verdict labels before re-reviewing.
      - name: Dismiss stale approvals
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr edit "$PR" --repo "$REPO" --remove-label "review: approved" || true
          gh pr edit "$PR" --repo "$REPO" --remove-label "review: changes-requested" || true
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq ".[] | select(.user.login == \"claude[bot]\" and .state == \"APPROVED\" and .commit_id != \"$HEAD_SHA\") | .id" \
            | while read -r REVIEW_ID; do
                gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$REVIEW_ID/dismissals" \
                  -f message="有新的 commit，此 approve 已失效，等待重新 review" -f event=DISMISS > /dev/null \
                  && echo "Dismissed review $REVIEW_ID" \
                  || echo "::warning::Failed to dismiss review $REVIEW_ID"
              done

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request yourself, in this session. Do NOT launch subagents or background tasks,
            and do not end your turn until all comments are posted.

            1. Read CLAUDE.md for project conventions.
            2. Use `gh pr view` and `gh pr diff` to read the PR description and changes.
            3. Look for correctness bugs, violations of CLAUDE.md hard rules, and missing tests for core logic.
               Only report issues you are confident about.
            4. For each issue, post an inline comment with mcp__github_inline_comment__create_inline_comment.
               Mark each one as [必修] (blocking) or [建議] (non-blocking).
               Blocking means: a correctness bug, a CLAUDE.md hard-rule violation, or missing tests for core logic.
               Style preferences and optional improvements are non-blocking.
            5. Finally, always submit exactly one review with a summary in Traditional Chinese:
               - any blocking issue: `gh pr review <N> --request-changes --body "<summary>"`
               - otherwise: `gh pr review <N> --approve --body "<summary>"` (list non-blocking suggestions, if any)
          show_full_output: true
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Read,Grep,Glob" --disallowedTools "Agent,Task,ScheduleWakeup"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # Mirror the bot's verdict on the current head commit as a label, so it is visible in the PR list.
      - name: Sync review label
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          STATE=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq ".[] | select(.user.login == \"claude[bot]\" and .commit_id == \"$HEAD_SHA\" and (.state == \"APPROVED\" or .state == \"CHANGES_REQUESTED\")) | .state" \
            | tail -n 1)
          case "$STATE" in
            APPROVED) gh pr edit "$PR" --repo "$REPO" --add-label "review: approved" ;;
            CHANGES_REQUESTED) gh pr edit "$PR" --repo "$REPO" --add-label "review: changes-requested" ;;
            *) echo "::warning::No approve/request-changes review from claude[bot] on $HEAD_SHA" ;;
          esac


# Seeds the `qa` commit status on every PR push so the PR list shows whether QA has passed.
# Docs and agent-config-only PRs (docs/, .claude/, .codex/, *.md) are marked success; everything else waits as pending until Lead (or the independent QA on high-risk cards) updates it.

name: QA status

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  statuses: write
  pull-requests: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
    - name: Set initial qa status
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        NON_DOCS=$(gh api --paginate "repos/$REPO/pulls/$PR/files" -q '.[].filename' \
          | grep -Ev '^(docs/|\.claude/|\.codex/)|\.md$' || true)
        if [ -z "$NON_DOCS" ]; then
          STATE=success; DESC="純文件，免 qa"
        else
          STATE=pending; DESC="待 Lead 核對：review gate／人工確認"
        fi
        gh api "repos/$REPO/statuses/$SHA" -f state="$STATE" -f context=qa -f description="$DESC"

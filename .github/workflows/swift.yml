# Builds the Xcode project (generated by XcodeGen) and runs the full test suite on an iOS Simulator.
# Runs only on version-bump PRs (head branch `chore/bump-*`) or manually, to save macOS runner minutes;
# everyday PRs run their related test classes locally (see docs/WORKFLOW.md).

name: Swift

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'chore/bump-')
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Pick iOS Simulator
      id: simulator
      run: |
        UDID=$(xcrun simctl list devices available -j \
          | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
        echo "Using simulator $UDID"
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"

    - name: Build and test
      run: |
        set -o pipefail
        xcodebuild test \
          -project DaysCam.xcodeproj \
          -scheme DaysCam \
          -destination "id=${{ steps.simulator.outputs.udid }}" \
          CODE_SIGNING_ALLOWED=NO

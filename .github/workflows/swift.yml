# Builds the Xcode project (generated by XcodeGen) and runs the full test suite on an iOS Simulator.
# Runs only on version/build-bump PRs (head branch `chore/bump-*` or `chore/build-*`) or manually, to save macOS runner minutes;
# everyday PRs run their related test classes locally (see docs/WORKFLOW.md).
# Unit tests and four UI-test shards run as parallel jobs: run serially the UI
# tests alone took ~50 min, while each shard now takes ~12 min. Shards are packed
# from scripts/ui-test-timings.json by scripts/ui-test-shard.py; refresh that
# file from a run's per-class durations when the shard times drift apart.

name: Swift

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: test (${{ matrix.suite }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'chore/bump-') || startsWith(github.head_ref, 'chore/build-')
    runs-on: macos-latest
    strategy:
      # Let every shard finish so one run reports all failures.
      fail-fast: false
      matrix:
        include:
          - suite: unit
          - { suite: ui-1, shard: 0 }
          - { suite: ui-2, shard: 1 }
          - { suite: ui-3, shard: 2 }
          - { suite: ui-4, shard: 3 }
    env:
      UI_SHARD_COUNT: 4

    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Pick iOS Simulator
      id: simulator
      run: |
        # Pin an iPhone 17 Pro on an iOS 26.x runtime so runs stay comparable;
        # fall back to the first iPhone when the image has none.
        DEVICES=$(xcrun simctl list devices available -j)
        UDID=$(echo "$DEVICES" | jq -r '[.devices | to_entries[] | select(.key | contains("iOS-26")) | .value[] | select(.name == "iPhone 17 Pro")][0].udid // empty')
        if [ -z "$UDID" ]; then
          UDID=$(echo "$DEVICES" | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
        fi
        echo "Using simulator $UDID"
        # Recorded so a failing pixel digest or timing test can be traced to the exact Xcode / runtime / device.
        xcodebuild -version
        xcrun simctl list devices available -j \
          | jq -r --arg u "$UDID" '.devices | to_entries[] | . as $runtime | .value[] | select(.udid == $u) | "\(.name) / \($runtime.key)"'
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"

    - name: Build for testing
      run: |
        set -o pipefail
        xcodebuild build-for-testing \
          -project DaysCam.xcodeproj \
          -scheme DaysCam \
          -destination "id=${{ steps.simulator.outputs.udid }}" \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO

    # AlbumAccessUITests opens the gallery, which registers with the real Photos
    # framework even though the permission outcome itself is faked, so a fresh
    # simulator shows the system Photos prompt and blocks every test in that
    # class (see its class comment). Grant it up front, the way a developer
    # does locally; `simctl privacy` needs the app installed first. iOS 26
    # still shows the prompt once after this, so the tests answer it too.
    - name: Grant Photos access on the simulator
      if: matrix.suite != 'unit'
      run: |
        UDID="${{ steps.simulator.outputs.udid }}"
        xcrun simctl bootstatus "$UDID" -b
        APP=$(find build/Build/Products -type d -name DaysCam.app -path "*iphonesimulator*" | head -n 1)
        test -n "$APP"
        xcrun simctl install "$UDID" "$APP"
        xcrun simctl privacy "$UDID" grant photos com.irenechou.DaysCam

    - name: Test
      run: |
        set -o pipefail
        if [ "${{ matrix.suite }}" = unit ]; then
          SELECTION="-only-testing:DaysCamTests"
        else
          SELECTION=$(python3 scripts/ui-test-shard.py "${{ matrix.shard }}" "$UI_SHARD_COUNT")
        fi
        # SELECTION is a list of flags without spaces inside, so word splitting is intended.
        # shellcheck disable=SC2086
        xcodebuild test-without-building \
          -project DaysCam.xcodeproj \
          -scheme DaysCam \
          -destination "id=${{ steps.simulator.outputs.udid }}" \
          -derivedDataPath build \
          $SELECTION \
          -resultBundlePath build/DaysCam.xcresult \
          CODE_SIGNING_ALLOWED=NO

    # The job log is too long to read back through the API; the result bundle
    # keeps every assertion message (e.g. the golden-digest table) and screenshot.
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: DaysCam-${{ matrix.suite }}.xcresult
        path: build/DaysCam.xcresult
        if-no-files-found: ignore

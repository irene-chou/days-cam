# Builds the Xcode project (generated by XcodeGen) and runs unit tests on an iOS Simulator.

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Pick iOS Simulator
      id: simulator
      run: |
        UDID=$(xcrun simctl list devices available -j \
          | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
        echo "Using simulator $UDID"
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"

    - name: Build and test
      run: |
        set -o pipefail
        xcodebuild test \
          -project DaysCam.xcodeproj \
          -scheme DaysCam \
          -destination "id=${{ steps.simulator.outputs.udid }}" \
          CODE_SIGNING_ALLOWED=NO

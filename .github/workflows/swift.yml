# Builds the Xcode project (generated by XcodeGen) and runs the full test suite on an iOS Simulator.
# Runs only on version-bump PRs (head branch `chore/bump-*`) or manually, to save macOS runner minutes;
# everyday PRs run their related test classes locally (see docs/WORKFLOW.md).

name: Swift

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'chore/bump-')
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Pick iOS Simulator
      id: simulator
      run: |
        UDID=$(xcrun simctl list devices available -j \
          | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
        echo "Using simulator $UDID"
        # Recorded so a failing pixel digest or timing test can be traced to the exact Xcode / runtime / device.
        xcodebuild -version
        xcrun simctl list devices available -j \
          | jq -r --arg u "$UDID" '.devices | to_entries[] | . as $runtime | .value[] | select(.udid == $u) | "\(.name) / \($runtime.key)"'
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"

    - name: Build for testing
      run: |
        set -o pipefail
        xcodebuild build-for-testing \
          -project DaysCam.xcodeproj \
          -scheme DaysCam \
          -destination "id=${{ steps.simulator.outputs.udid }}" \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO

    # AlbumAccessUITests opens the gallery, which registers with the real Photos
    # framework even though the permission outcome itself is faked, so a fresh
    # simulator shows the system Photos prompt and blocks every test in that
    # class (see its class comment). Grant it up front, the way a developer
    # does locally; `simctl privacy` needs the app installed first.
    - name: Grant Photos access on the simulator
      run: |
        UDID="${{ steps.simulator.outputs.udid }}"
        xcrun simctl bootstatus "$UDID" -b
        APP=$(find build/Build/Products -type d -name DaysCam.app -path "*iphonesimulator*" | head -n 1)
        test -n "$APP"
        xcrun simctl install "$UDID" "$APP"
        xcrun simctl privacy "$UDID" grant photos com.irenechou.DaysCam

    - name: Test
      run: |
        set -o pipefail
        xcodebuild test-without-building \
          -project DaysCam.xcodeproj \
          -scheme DaysCam \
          -destination "id=${{ steps.simulator.outputs.udid }}" \
          -derivedDataPath build \
          -resultBundlePath build/DaysCam.xcresult \
          CODE_SIGNING_ALLOWED=NO

    # The job log is too long to read back through the API; the result bundle
    # keeps every assertion message (e.g. the golden-digest table) and screenshot.
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: DaysCam.xcresult
        path: build/DaysCam.xcresult
        if-no-files-found: ignore

name: DaysCam
options:
  bundleIdPrefix: com.irenechou
  deploymentTarget:
    iOS: "18.0"
settings:
  DEVELOPMENT_TEAM: "W5937V2WUF"
targets:
  DaysCam:
    type: application
    platform: iOS
    sources:
      - path: DaysCam
    info:
      path: DaysCam/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: DaysCam 需要使用相機來拍照，並把天數印在照片上。
        NSPhotoLibraryAddUsageDescription: DaysCam 需要權限才能把拍好的照片存進你的相簿。
        NSPhotoLibraryUsageDescription: DaysCam 需要讀取權限，才能在 App 裡瀏覽你用 DaysCam 拍的照片。
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        # 上架用：只用 HTTPS 下載字型，屬於出口管制豁免，免每次上傳都回答加密問卷（docs/RELEASE.md）。
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irenechou.DaysCam
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
  DaysCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DaysCamTests
    dependencies:
      - target: DaysCam
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
  DaysCamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DaysCamUITests
    dependencies:
      - target: DaysCam
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  DaysCam:
    build:
      targets:
        DaysCam: all
        DaysCamTests: [test]
        DaysCamUITests: [test]
    test:
      targets:
        - DaysCamTests
        - DaysCamUITests

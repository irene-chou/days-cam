name: DaysCam
options:
  bundleIdPrefix: com.irenechou
  deploymentTarget:
    iOS: "18.0"
settings:
  DEVELOPMENT_TEAM: "W5937V2WUF"
targets:
  DaysCam:
    type: application
    platform: iOS
    sources:
      - path: DaysCam
    info:
      path: DaysCam/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: DaysCam 需要使用相機來拍照，並把天數印在照片上。
        NSPhotoLibraryAddUsageDescription: DaysCam 需要權限才能把拍好的照片存進你的相簿。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irenechou.DaysCam
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
  DaysCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DaysCamTests
    dependencies:
      - target: DaysCam
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"

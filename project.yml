name: TallyCam
options:
  bundleIdPrefix: com.irenechou
  deploymentTarget:
    iOS: "17.0"
settings:
  DEVELOPMENT_TEAM: ""
targets:
  TallyCam:
    type: application
    platform: iOS
    sources:
      - path: TallyCam
    info:
      path: TallyCam/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irenechou.TallyCam
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
